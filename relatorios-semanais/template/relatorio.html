<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Relatório semanal · Grupo Opera</title>
<style>
  /* fontes embutidas (OFL), subconjunto latino: o PDF sai igual sem internet */
  @font-face { font-family: 'Inter'; font-weight: 100 900; font-display: block; src: url(fontes/inter.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; font-display: block; src: url(fontes/poppins-600.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; font-display: block; src: url(fontes/poppins-700.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 800; font-display: block; src: url(fontes/poppins-800.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 900; font-display: block; src: url(fontes/poppins-900.woff2) format('woff2'); }
  :root {
    --navy: #00247d;
    --navy-2: #0b2f8c;
    --orange: #e85d1b;
    --orange-soft: #f6a24e;
    --sky: #a9c3e6;
    --ice: #eef3fb;
    --line: #e2e8f2;
    --line-2: #eef2f8;
    --ink: #1c2747;
    --muted: #47547a;
    --muted-2: #8b93ab;
    --cream: #fdeee5;
    --green: #15803d;
    --green-bg: #e4f5ea;
    --red: #b42318;
    --red-bg: #fdecea;
    --gray-bg: #eef0f4;
    --display: 'Poppins', 'Inter', sans-serif;
    --body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d9dde6; }
  body { font-family: var(--body); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @media screen { .page { margin: 24px auto; box-shadow: 0 6px 30px rgba(0,0,0,.18); } }

  .page { width: 210mm; height: 297mm; position: relative; overflow: hidden; background: #fff; page-break-after: always; break-after: page; }
  .page:last-child { page-break-after: auto; break-after: auto; }

  .hl { color: var(--orange); font-style: normal; }
  .cover .hl { color: var(--orange-soft); }
  strong { font-weight: 700; }

  /* ---------- logo ---------- */
  .logo { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.4px; color: #fff; line-height: 1; }
  .logo i { font-style: normal; color: var(--orange); }

  /* ---------- capa ---------- */
  .cover { background: var(--navy); color: #fff; display: flex; flex-direction: column; }
  .cover::before { content: ''; position: absolute; right: -140px; top: -160px; width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,150,220,.28) 0%, rgba(40,70,160,.10) 45%, rgba(0,36,125,0) 70%); }
  .cover-top { padding: 52px 46px 0; position: relative; }
  .cover-hero { padding: 120px 46px 0; position: relative; }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 9.5px; font-weight: 700; letter-spacing: 3.2px; text-transform: uppercase; color: var(--orange-soft); }
  .eyebrow::before { content: ''; width: 26px; height: 2.5px; background: var(--orange-soft); border-radius: 2px; }
  .cover h1 { font-family: var(--display); font-weight: 800; font-size: 41px; line-height: 1.08; letter-spacing: -1.4px; margin-top: 22px; }
  .cover h1 .l2 { display: block; color: var(--sky); }
  .cover .resumo { margin-top: 22px; max-width: 490px; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.86); }
  .cover .resumo strong { color: #fff; }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chip { font-size: 10.5px; font-weight: 700; padding: 9px 15px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); color: #fff; background: rgba(0,0,0,.08); }
  .chip.on { background: var(--orange); border-color: var(--orange); }
  .cover-spacer { flex: 1; }
  .destaque { margin: 0 46px 28px; position: relative; border: 1px solid rgba(255,255,255,.13); background: rgba(255,255,255,.045); border-radius: 14px; padding: 26px 26px 26px 30px; display: flex; gap: 28px; align-items: center; }
  .destaque .num { min-width: 92px; text-align: center; }
  .destaque .num b { display: block; font-family: var(--display); font-weight: 900; font-size: 54px; line-height: .95; letter-spacing: -1.5px; }
  .destaque .num span { display: block; margin-top: 10px; font-size: 9px; font-weight: 700; letter-spacing: 2.6px; text-transform: uppercase; color: var(--orange-soft); }
  .destaque .eb { font-size: 9px; font-weight: 700; letter-spacing: 2.6px; text-transform: uppercase; color: var(--orange-soft); }
  .destaque h2 { font-family: var(--display); font-weight: 800; font-size: 18.5px; line-height: 1.22; letter-spacing: -.5px; margin-top: 7px; }
  .destaque p { margin-top: 8px; font-size: 11.5px; line-height: 1.55; color: rgba(255,255,255,.78); }
  .faixa { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid rgba(255,255,255,.12); position: relative; }
  .faixa > div { padding: 22px 20px 26px 22px; border-left: 1px solid rgba(255,255,255,.12); }
  .faixa > div:first-child { border-left: 0; padding-left: 22px; }
  .faixa b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.6px; white-space: nowrap; }
  .faixa b .hl { color: var(--orange-soft); }
  .faixa span { display: block; margin-top: 6px; font-size: 9.8px; line-height: 1.45; color: rgba(255,255,255,.74); }

  /* ---------- páginas internas ---------- */
  .band { height: 54px; background: var(--navy); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; position: relative; overflow: hidden; }
  .band::after { content: ''; position: absolute; right: -60px; top: -120px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(120,150,220,.25), rgba(0,36,125,0) 65%); }
  .band .marca { margin-top: 5px; font-size: 7.5px; font-weight: 700; letter-spacing: 2.6px; text-transform: uppercase; color: var(--sky); }
  .band .dir { text-align: right; position: relative; z-index: 1; }
  .band .dir b { display: block; font-family: var(--display); font-weight: 700; font-size: 12px; }
  .band .dir span { display: block; font-size: 10px; color: rgba(255,255,255,.75); margin-top: 2px; }
  .body { position: absolute; top: 54px; bottom: 52px; left: 0; right: 0; padding: 28px 40px 0; overflow: hidden; }
  .foot { position: absolute; left: 40px; right: 40px; bottom: 0; height: 52px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-size: 9px; color: var(--muted-2); }
  .foot b { font-family: var(--display); font-weight: 700; color: var(--navy); }
  .foot b i { font-style: normal; color: var(--orange); }

  .blk { margin-bottom: 18px; }
  .sec-eb { font-size: 9px; font-weight: 700; letter-spacing: 2.6px; text-transform: uppercase; color: var(--orange); }
  .sec-eb em { font-style: normal; color: var(--muted-2); margin-right: 8px; }
  .sec h2 { font-family: var(--display); font-weight: 800; font-size: 25px; letter-spacing: -.8px; color: var(--navy); margin-top: 6px; line-height: 1.15; }
  .sec p { margin-top: 8px; font-size: 11.5px; line-height: 1.6; color: var(--muted); max-width: 540px; }
  .sec p strong { color: var(--ink); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 11px; padding: 18px 14px 14px; position: relative; background: #fff; }
  .kpi::before { content: ''; position: absolute; top: -1px; left: 14px; width: 26px; height: 4px; border-radius: 0 0 3px 3px; background: var(--orange); }
  .kpi b { display: block; font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -.6px; color: var(--navy); white-space: nowrap; }
  .kpi b small { font-size: 12px; color: var(--orange); margin-left: 2px; letter-spacing: 0; }
  .kpi span { display: block; margin-top: 6px; font-size: 9.6px; line-height: 1.4; color: var(--muted); }
  .kpi em { display: block; margin-top: 7px; font-style: normal; font-size: 9px; font-weight: 700; }
  .pos { color: var(--green); } .neg { color: var(--red); } .neu { color: var(--muted-2); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .col { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .col-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--ice); }
  .col-h b { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--navy); }
  .col-h span { font-size: 8.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted-2); }
  .col.atual .col-h { background: var(--orange); }
  .col.atual .col-h b, .col.atual .col-h span { color: #fff; }
  .col-b { padding: 6px 18px 10px; }
  .grp { font-size: 8.5px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--orange); padding: 12px 0 4px; }
  .grp + .row { border-top: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; height: 30px; border-top: 1px solid var(--line-2); font-size: 11px; color: var(--ink); }
  .row .v { font-family: var(--display); font-weight: 700; font-size: 12.5px; color: var(--navy); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .row .v.up { color: var(--orange); }
  .row .v.nd { color: var(--muted-2); font-weight: 600; }
  .bdg { font-family: var(--body); font-size: 8px; font-weight: 700; padding: 3px 6px; border-radius: 999px; }
  .bdg.pos { background: var(--green-bg); } .bdg.neg { background: var(--red-bg); } .bdg.neu { background: var(--gray-bg); }
  .compacto .row { height: 26px; }
  .compacto .grp { padding-top: 10px; }
  .cont { font-size: 8.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 8px; }

  .chart { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 14px; }
  .chart h3 { font-family: var(--display); font-weight: 700; font-size: 13.5px; color: var(--navy); }
  .chart .sub { font-size: 10px; color: var(--muted-2); margin-top: 3px; }
  .chart svg { display: block; margin-top: 8px; }
  .legend { display: flex; gap: 18px; font-size: 10px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .note { font-size: 8.8px; line-height: 1.5; color: var(--muted-2); }

  /* ---------- conteúdo ---------- */
  .feat { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fcard { background: var(--navy); color: #fff; border-radius: 12px; padding: 18px 20px; position: relative; overflow: hidden; }
  .fcard::after { content: ''; position: absolute; right: -80px; top: -90px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(120,150,220,.25), rgba(0,36,125,0) 65%); }
  .fcard .eb { font-size: 8.5px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--orange-soft); }
  .fcard h4 { font-family: var(--display); font-weight: 700; font-size: 13.5px; line-height: 1.25; margin-top: 8px; letter-spacing: -.2px; }
  .fcard p { font-size: 10px; line-height: 1.5; color: rgba(255,255,255,.78); margin-top: 6px; }
  .fstats { display: flex; gap: 24px; margin-top: 12px; position: relative; z-index: 1; }
  .fstats b { display: block; font-family: var(--display); font-weight: 800; font-size: 17px; }
  .fstats b.hl { color: var(--orange-soft); }
  .fstats span { font-size: 8.5px; color: rgba(255,255,255,.7); }
  .posts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .post { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; min-height: 96px; }
  .post .dt { width: 62px; flex: none; background: var(--navy); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .post .dt .play { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.18); position: relative; }
  .post .dt .play::after { content: ''; position: absolute; left: 7px; top: 5px; border-left: 6px solid #fff; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
  .post .dt b { font-family: var(--display); font-weight: 800; font-size: 15px; }
  .post .dt span { font-size: 7.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  .post.total .dt { background: linear-gradient(180deg, var(--orange), #c94b10); }
  .post .tx { padding: 11px 14px; flex: 1; }
  .tag { display: inline-block; font-size: 7.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--navy); background: var(--ice); padding: 3px 8px; border-radius: 999px; }
  .post.total .tag { background: var(--cream); color: var(--orange); }
  .post h5 { font-family: var(--display); font-weight: 700; font-size: 11.5px; color: var(--navy); margin-top: 6px; line-height: 1.25; }
  .post p { font-size: 9.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .post .st { margin-top: 6px; font-size: 9px; color: var(--muted-2); }
  .post .st b { font-family: var(--display); font-weight: 700; color: var(--navy); font-size: 10px; margin-right: 1px; }
  .post .st b.hl { color: var(--orange); }
  .post .st span + span { margin-left: 10px; }

  .leitura { background: var(--cream); border-left: 4px solid var(--orange); border-radius: 0 10px 10px 0; padding: 16px 20px; }
  .leitura .eb { font-size: 8.5px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--orange); }
  .leitura p { font-size: 11px; line-height: 1.6; color: var(--ink); margin-top: 6px; }
  .prox { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .prox > div { border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .prox .eb { font-size: 8.5px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--orange); }
  .prox b { display: block; font-family: var(--display); font-weight: 700; font-size: 12.5px; color: var(--navy); margin-top: 6px; }
  .prox p { font-size: 10px; line-height: 1.5; color: var(--muted); margin-top: 6px; }

  /* ---------- carimbo de prévia ---------- */
  .stamp { position: absolute; z-index: 50; top: 14px; left: 50%; transform: translateX(-50%); background: #ffe14d; color: #3a2a00; font-size: 9px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 5px 14px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.2); white-space: nowrap; }
  .wm { position: absolute; z-index: 40; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .wm span { transform: rotate(-32deg); font-family: var(--display); font-weight: 900; font-size: 84px; letter-spacing: 4px; color: rgba(232,93,27,.09); white-space: nowrap; }
  .cover .wm span { color: rgba(255,255,255,.07); }
</style>
</head>
<body>
<div id="doc"></div>
<script>
// a paginação mede o texto, então as fontes precisam estar carregadas antes de montar
const FONTES = ['600 12px Poppins', '700 12px Poppins', '800 12px Poppins', '900 12px Poppins', '400 12px Inter', '500 12px Inter', '600 12px Inter', '700 12px Inter'];
Promise.all(FONTES.map((f) => document.fonts.load(f).catch(() => null))).then(() => document.fonts.ready).then(montar);
function montar() {
  const R = window.RELATORIO;
  const doc = document.getElementById('doc');

  // ---------- formatação ----------
  const nf = (d) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  function fmt(v, f) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    switch (f) {
      case 'brl': return 'R$ ' + nf(Math.abs(v) >= 1000 ? 0 : 2).format(v);
      case 'pct': return nf(Math.abs(v) >= 10 ? 1 : 2).format(v) + '%';
      case 'dec': return nf(Number.isInteger(v) ? 0 : 1).format(v);
      case 'horas': return nf(v / 60 >= 100 ? 0 : 1).format(v / 60) + ' h';
      default: return nf(0).format(v);
    }
  }
  function fmtCurto(v, f) {
    if (f === 'brl') return 'R$ ' + fmtCurto(v, 'int');
    if (Math.abs(v) >= 1000) return nf(v >= 10000 ? 0 : 1).format(v / 1000).replace(/,0$/, '') + 'k';
    return nf(0).format(v);
  }
  function variacao(l) {
    const a = l.atual, b = l.anterior;
    if (a == null || b == null || b === 0) return null;
    const p = (a - b) / Math.abs(b) * 100;
    if (Math.abs(p) < 0.5) return { txt: '= estável', cls: 'neu', p };
    const seta = p > 0 ? '▲' : '▼';
    const txt = seta + ' ' + nf(Math.abs(p) >= 10 ? 0 : 1).format(Math.abs(p)) + '%';
    let cls = 'neu';
    if (l.melhor === 'maior') cls = p > 0 ? 'pos' : 'neg';
    if (l.melhor === 'menor') cls = p < 0 ? 'pos' : 'neg';
    return { txt, cls, p };
  }
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // **negrito** e *destaque laranja*
  const md = (s) => esc(s || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em class="hl">$1</em>');
  const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const d = (iso) => { const [y, m, dd] = iso.split('-').map(Number); return { y, m, d: dd }; };
  const dm = (iso) => { const x = d(iso); return String(x.d).padStart(2, '0') + '/' + String(x.m).padStart(2, '0'); };
  const faixa = (p) => dm(p.inicio) + ' a ' + dm(p.fim);
  const dias = (p) => Math.round((Date.parse(p.fim) - Date.parse(p.inicio)) / 864e5) + 1;
  const A = R.periodo.atual, B = R.periodo.anterior;
  const anoA = d(A.fim).y;

  const T = R.texto || {};
  const linhas = R.grupos.flatMap((g) => g.linhas.map((l) => Object.assign({ grupo: g.titulo }, l)));
  const candidatos = linhas.filter((l) => l.kpi && l.atual != null).sort((x, y) => x.kpi - y.kpi);

  function marcaPagina(p) {
    if (!R.ficticio) return;
    p.appendChild(el('<div class="stamp">Prévia do template · dados fictícios</div>'));
    p.appendChild(el('<div class="wm"><span>EXEMPLO</span></div>'));
  }

  // ---------- capa ----------
  function capa() {
    const p = el('<section class="page cover"></section>');
    const titulo = T.titulo || 'Resultados da *semana*.';
    const sub = T.subtitulo || ('De ' + faixa(A) + ' de ' + anoA + '.');
    const resumo = T.resumo || ('Resumo dos resultados de **' + R.plataformas.join(', ') + '** da ' + R.marca + ', comparando a semana de ' + faixa(A) + ' com a semana anterior.');
    p.innerHTML = `
      <div class="cover-top"><div class="logo">Grupo Opera<i>.</i></div></div>
      <div class="cover-hero">
        <div class="eyebrow">Relatório semanal · ${esc(R.marca)}</div>
        <h1>${md(titulo)}<span class="l2">${md(sub)}</span></h1>
        <p class="resumo">${md(resumo)}</p>
        <div class="chips"><span class="chip">Semana anterior · ${faixa(B)}</span><span class="chip on">Semana atual · ${faixa(A)}</span></div>
      </div>
      <div class="cover-spacer"></div>`;
    const dst = T.destaque;
    if (dst) {
      p.appendChild(el(`<div class="destaque">
        <div class="num"><b>${esc(dst.numero)}</b><span>${esc(dst.rotulo || '')}</span></div>
        <div><div class="eb">Destaque da semana</div><h2>${md(dst.titulo)}</h2>${dst.texto ? `<p>${md(dst.texto)}</p>` : ''}</div>
      </div>`));
    }
    let itens = T.kpis_capa;
    if (!itens) {
      itens = candidatos.slice(0, 4).map((l) => {
        const v = variacao(l);
        const valor = l.formato === 'brl' ? fmt(l.atual, 'brl').replace(/^R\$ (.*)$/, 'R$ *$1*') : fmt(l.atual, l.formato);
        return { valor, texto: l.rotulo.toLowerCase() + ' · ' + l.grupo.replace('Anúncios · ', '') + (v ? ' (' + v.txt.replace('▲', '+').replace('▼', '−') + ' vs. semana anterior)' : '') };
      });
    }
    if (itens.length) {
      const f = el('<div class="faixa"></div>');
      itens.slice(0, 4).forEach((k) => f.appendChild(el(`<div><b>${md(k.valor)}</b><span>${md(k.texto)}</span></div>`)));
      for (let i = itens.length; i < 4; i++) f.appendChild(el('<div></div>'));
      p.appendChild(f);
    }
    marcaPagina(p);
    doc.appendChild(p);
  }

  // ---------- páginas internas com paginação automática ----------
  let pagina = 1, body = null;
  function novaPagina() {
    pagina++;
    const p = el(`<section class="page">
      <header class="band"><div><div class="logo">Grupo Opera<i>.</i></div><div class="marca">${esc(R.marca)}</div></div>
        <div class="dir"><b>Relatório semanal</b><span>${faixa(A)}/${anoA} · vs. ${faixa(B)}</span></div></header>
      <div class="body"></div>
      <footer class="foot"><span><b>Grupo Opera<i>.</i></b> · Relatório semanal ${esc(R.marca)}</span><span>${String(pagina).padStart(2, '0')}</span></footer>
    </section>`);
    marcaPagina(p);
    doc.appendChild(p);
    body = p.querySelector('.body');
  }
  const cabe = () => body.scrollHeight <= body.clientHeight + 1;
  function colocar(bloco, opts) {
    opts = opts || {};
    if (!body || opts.novaPagina) novaPagina();
    body.appendChild(bloco);
    if (cabe()) return true;
    body.removeChild(bloco);
    if (opts.dividir) return opts.dividir();
    novaPagina();
    body.appendChild(bloco);
    return true;
  }

  function secao(num, eb, titulo, texto) {
    return el(`<div class="blk sec"><div class="sec-eb"><em>${num}</em>${esc(eb)}</div><h2>${md(titulo)}</h2>${texto ? `<p>${md(texto)}</p>` : ''}</div>`);
  }

  function blocoKpis() {
    let itens = T.kpis;
    if (!itens) {
      itens = candidatos.slice(0, 4).map((l) => {
        const v = variacao(l);
        return { valor: fmt(l.atual, l.formato), rotulo: l.rotulo + ' · ' + l.grupo.replace('Anúncios · ', ''), variacao: v ? v.txt + ' vs. semana anterior' : 'sem base na semana anterior', classe: v ? v.cls : 'neu' };
      });
    }
    if (!itens.length) return null;
    const k = el('<div class="blk kpis"></div>');
    itens.slice(0, 4).forEach((i) => k.appendChild(el(`<div class="kpi"><b>${md(i.valor)}${i.sufixo ? `<small>${esc(i.sufixo)}</small>` : ''}</b><span>${md(i.rotulo)}</span>${i.variacao ? `<em class="${i.classe || 'neu'}">${esc(i.variacao)}</em>` : ''}</div>`)));
    return k;
  }

  function blocoColunas(grupos, continuacao) {
    const meta = (p) => faixa(p) + ' · ' + dias(p) + ' dias';
    const ant = el(`<div class="col"><div class="col-h"><b>Semana anterior</b><span>${meta(B)}</span></div><div class="col-b"></div></div>`);
    const atu = el(`<div class="col atual"><div class="col-h"><b>Semana atual</b><span>${meta(A)}</span></div><div class="col-b"></div></div>`);
    grupos.forEach((g) => {
      ant.lastChild.appendChild(el(`<div class="grp">${esc(g.titulo)}</div>`));
      atu.lastChild.appendChild(el(`<div class="grp">${esc(g.titulo)}</div>`));
      g.linhas.forEach((l) => {
        const v = variacao(l);
        ant.lastChild.appendChild(el(`<div class="row"><span>${esc(l.rotulo)}</span><span class="v${l.anterior == null ? ' nd' : ''}">${fmt(l.anterior, l.formato)}</span></div>`));
        const up = v && v.cls === 'pos' && Math.abs(v.p) >= 5;
        atu.lastChild.appendChild(el(`<div class="row"><span>${esc(l.rotulo)}</span><span class="v${up ? ' up' : ''}${l.atual == null ? ' nd' : ''}">${fmt(l.atual, l.formato)}${v ? `<span class="bdg ${v.cls}">${v.txt}</span>` : ''}</span></div>`));
      });
    });
    const w = el('<div class="blk"></div>');
    if (continuacao) w.appendChild(el('<div class="cont">Números da semana · continuação</div>'));
    const c = el('<div class="cols"></div>');
    c.appendChild(ant); c.appendChild(atu); w.appendChild(c);
    return w;
  }

  function colocarColunas(grupos, continuacao, paginaNova) {
    if (!grupos.length) return;
    // tenta caber o máximo de grupos na página atual; o resto segue na próxima
    for (let n = grupos.length; n >= 1; n--) {
      const b = blocoColunas(grupos.slice(0, n), continuacao);
      body.appendChild(b);
      if (cabe()) { colocarColunas(grupos.slice(n), true); return; }
      body.removeChild(b);
    }
    novaPagina();
    if (paginaNova) { // nem um grupo cabe numa página inteira: coloca assim mesmo
      body.appendChild(blocoColunas(grupos.slice(0, 1), true));
      colocarColunas(grupos.slice(1), true);
      return;
    }
    colocarColunas(grupos, true, true);
  }

  function blocoGrafico(g) {
    const W = 634, H = 170, padL = 34, padB = 22, padT = 22;
    const pts = g.anterior.map((x) => ({ x, s: 'a' })).concat(g.atual.map((x) => ({ x, s: 'b' })));
    const vals = pts.map((p) => p.x.valor || 0);
    const max = Math.max(1, ...vals);
    const passo = Math.pow(10, Math.floor(Math.log10(max)));
    const topo = [1, 2, 2.5, 5, 10].map((m) => m * passo).find((t) => t * 3 >= max) * 3 || max;
    const n = pts.length, slot = (W - padL) / n, bw = Math.min(26, slot * 0.62);
    const y = (v) => padT + (H - padT - padB) * (1 - v / topo);
    let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Inter" font-size="9" fill="#8b93ab">`;
    for (let i = 0; i <= 3; i++) {
      const v = topo * i / 3, yy = y(v);
      svg += `<line x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}" stroke="#eef2f8"/><text x="${padL - 6}" y="${yy + 3}" text-anchor="end">${fmtCurto(v, g.formato)}</text>`;
    }
    let iMax = 0;
    pts.forEach((p, i) => { if ((p.x.valor || 0) > (pts[iMax].x.valor || 0)) iMax = i; });
    pts.forEach((p, i) => {
      const cx = padL + slot * i + slot / 2, v = p.x.valor || 0, yy = y(v);
      svg += `<rect x="${cx - bw / 2}" y="${yy}" width="${bw}" height="${Math.max(0, H - padB - yy)}" rx="2.5" fill="${p.s === 'a' ? '#00247d' : '#e85d1b'}"/>`;
      svg += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${dm(p.x.data)}</text>`;
    });
    if (vals[iMax] > 0) {
      const cx = padL + slot * iMax + slot / 2;
      svg += `<line x1="${cx}" x2="${cx}" y1="12" y2="${y(vals[iMax])}" stroke="#e85d1b" stroke-dasharray="3 3"/>`;
      const anchor = iMax > n * 0.7 ? 'end' : (iMax < n * 0.3 ? 'start' : 'middle');
      svg += `<text x="${cx + (anchor === 'end' ? 4 : anchor === 'start' ? -4 : 0)}" y="9" text-anchor="${anchor}" fill="#e85d1b" font-weight="700" font-size="9.5">pico ${fmt(vals[iMax], g.formato)} em ${dm(pts[iMax].x.data)}</text>`;
    }
    const sep = padL + slot * g.anterior.length;
    svg += `<line x1="${sep}" x2="${sep}" y1="${padT - 6}" y2="${H - padB}" stroke="#e2e8f2"/>`;
    svg += '</svg>';
    return el(`<div class="blk chart"><h3>${esc(g.titulo)}</h3><div class="sub">${esc(g.subtitulo || '')}, de ${dm(B.inicio)} a ${dm(A.fim)}</div>${svg}
      <div class="legend"><span><i style="background:#00247d"></i>Semana anterior</span><span><i style="background:#e85d1b"></i>Semana atual</span></div></div>`);
  }

  function blocosConteudo(c) {
    const out = [];
    const posts = c.posts || [];
    const destaques = posts.filter((p) => p.destaque).slice(0, 2);
    const resto = posts.filter((p) => !destaques.includes(p));
    if (destaques.length) {
      const f = el('<div class="blk feat"></div>');
      destaques.forEach((p) => f.appendChild(el(`<div class="fcard"><div class="eb">${esc(p.etiqueta || 'Destaque')} · ${dm(p.data)}</div><h4>${md(p.titulo)}</h4>${p.descricao ? `<p>${md(p.descricao)}</p>` : ''}
        <div class="fstats">${(p.numeros || []).map((n, i) => `<div><b class="${i === 1 ? 'hl' : ''}">${esc(n.valor)}</b><span>${esc(n.rotulo)}</span></div>`).join('')}</div></div>`)));
      out.push(f);
    }
    const cards = resto.map((p) => {
      const x = p.data ? d(p.data) : { d: 0, m: 1 };
      return `<div class="post${p.total ? ' total' : ''}"><div class="dt"><div class="play"></div><b>${p.total ? esc(p.qtd || '') : String(x.d).padStart(2, '0')}</b><span>${p.total ? 'posts' : meses[x.m - 1]}</span></div>
        <div class="tx">${p.etiqueta ? `<span class="tag">${esc(p.etiqueta)}</span>` : ''}<h5>${md(p.titulo)}</h5>${p.descricao ? `<p>${md(p.descricao)}</p>` : ''}
        <div class="st">${(p.numeros || []).map((n, i) => `<span><b class="${n.hl ? 'hl' : ''}">${esc(n.valor)}</b> ${esc(n.rotulo)}</span>`).join('')}</div></div></div>`;
    });
    for (let i = 0; i < cards.length; i += 2) out.push(el(`<div class="blk posts">${cards.slice(i, i + 2).join('')}</div>`));
    return out;
  }

  // ---------- montagem ----------
  if (linhas.length > 16) doc.classList.add('compacto');
  capa();

  const intro = T.intro_numeros || ('Comparação da semana de **' + faixa(A) + '** com a semana anterior (' + faixa(B) + '), por canal.');
  colocar(secao('01', 'Semana × semana', T.titulo_numeros || 'Os números, *semana a semana*', intro), { novaPagina: true });
  const k = blocoKpis(); if (k) colocar(k);
  colocarColunas(R.grupos.filter((g) => g.linhas.length), false);
  if (R.grafico && (R.grafico.atual || []).length) colocar(blocoGrafico(R.grafico));
  colocar(el(`<div class="blk note">${md(R.fonte)}</div>`));

  const temConteudo = R.conteudo && (R.conteudo.posts || []).length;
  if (temConteudo) {
    colocar(secao('02', R.conteudo.eyebrow || 'Conteúdo', R.conteudo.titulo || 'Conteúdos *da semana*', R.conteudo.texto), { novaPagina: true });
    blocosConteudo(R.conteudo).forEach((b) => colocar(b));
  }
  if (T.leitura) colocar(el(`<div class="blk leitura"><div class="eb">Leitura</div><p>${md(T.leitura)}</p></div>`));
  if ((T.proximos || []).length) {
    const pr = el('<div class="blk prox"></div>');
    T.proximos.slice(0, 3).forEach((x, i) => pr.appendChild(el(`<div><div class="eb">Próximo ${String(i + 1).padStart(2, '0')}</div><b>${md(x.titulo)}</b><p>${md(x.texto)}</p></div>`)));
    colocar(pr);
  }
  if (temConteudo && R.conteudo.nota) colocar(el(`<div class="blk note">${md(R.conteudo.nota)}</div>`));

  window.__pronto = true;
}
</script>
</body>
</html>
