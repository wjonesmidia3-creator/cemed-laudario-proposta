<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Grupo Opera · Dreisson Imóveis</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --navy:#00247d; --navy-deep:#00174f; --royal:#1d4fd8;
    --orange:#e85c18; --orange-soft:#f4a04c; --ice:#a8c0e4;
  }
  html,body{margin:0;padding:0}
  body{width:1224px;height:1022px;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff;background:var(--navy-deep)}
  .card{position:relative;width:1224px;height:1022px;overflow:hidden;background:var(--bg)}
  .bg-azul{--bg:
      radial-gradient(55% 50% at 96% 4%,  rgba(120,160,255,.70) 0%, rgba(120,160,255,0) 70%),
      radial-gradient(40% 45% at 100% 40%, rgba(168,192,228,.30) 0%, rgba(168,192,228,0) 70%),
      radial-gradient(60% 55% at 0% 88%,  rgba(64,120,255,.90) 0%, rgba(64,120,255,0) 70%),
      radial-gradient(45% 40% at 6% 4%,   rgba(40,80,200,.55) 0%, rgba(40,80,200,0) 70%),
      radial-gradient(52% 50% at 45% 45%, rgba(0,12,48,.88) 0%, rgba(0,12,48,0) 75%),
      linear-gradient(160deg, #0a2a8f 0%, #00247d 45%, #001a66 100%);}
  .bg-laranja{--bg:
      radial-gradient(38% 38% at 100% 0%, rgba(255,110,40,.95) 0%, rgba(240,90,30,.55) 35%, rgba(232,92,24,0) 72%),
      radial-gradient(30% 34% at 100% 26%, rgba(244,160,76,.45) 0%, rgba(244,160,76,0) 70%),
      radial-gradient(60% 55% at 0% 88%,  rgba(64,120,255,.90) 0%, rgba(64,120,255,0) 70%),
      radial-gradient(45% 40% at 6% 4%,   rgba(40,80,200,.55) 0%, rgba(40,80,200,0) 70%),
      radial-gradient(52% 50% at 45% 45%, rgba(0,12,48,.88) 0%, rgba(0,12,48,0) 75%),
      linear-gradient(160deg, #0a2a8f 0%, #00247d 45%, #001a66 100%);}
  /* leve granulado, como no card original */
  .card::after{content:"";position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}

  .brand{position:absolute;left:0;right:0;text-align:center}
  .kicker{top:296px;font-weight:300;font-size:58px;letter-spacing:.52em;line-height:1;display:flex;align-items:center;justify-content:center;gap:34px}
  .kicker .rule{display:block;width:64px;height:4px;background:var(--orange);border-radius:2px}
  .mark{top:358px;font-weight:700;font-size:268px;letter-spacing:-.035em;line-height:1}
  .mark .dot{color:var(--orange)}

  .lockup{top:395px;font-weight:700;font-size:150px;letter-spacing:-.03em;line-height:1}
  .lockup .dot{color:var(--orange)}
  .tag{top:540px;font-weight:300;font-size:56px;letter-spacing:.5em;padding-left:.5em;line-height:1;color:#fff}

  .pill{position:absolute;left:94px;width:1036px;top:815px;height:150px;box-sizing:border-box;
    border:2.5px solid rgba(255,255,255,.78);border-radius:30px;background:rgba(255,255,255,.04);
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:80px;letter-spacing:.01em;line-height:1}

  .kicker .txt{margin-right:-.52em}
  .v-b .kicker,.v-b .mark{display:none}
  .v-a .lockup,.v-a .tag{display:none}
</style>
</head>
<body>
<div class="card" id="card">
  <!-- Variante A: GRUPO + Opera. (mesma hierarquia do card OZ) -->
  <div class="brand kicker"><span class="rule"></span><span class="txt">GRUPO</span><span class="rule"></span></div>
  <div class="brand mark">Opera<span class="dot">.</span></div>

  <!-- Variante B: logo completo em uma linha -->
  <div class="brand lockup">Grupo Opera<span class="dot">.</span></div>

  <div class="pill">DREISSON IMÓVEIS</div>
</div>
<script>
  const [v, bg] = (location.hash.slice(1) || 'a-azul').split('-');
  document.getElementById('card').classList.add('v-' + v, 'bg-' + bg);
</script>
</body>
</html>
